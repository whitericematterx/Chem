name: Update DuckDNS

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to run it manually

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DuckDNS API
        run: |
          curl -s "https://duckdns.org{{ secrets.DUCKDNS_DOMAIN }}&token=${{ secrets.DUCKDNS_TOKEN }}&ip="
